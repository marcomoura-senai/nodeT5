name: sctec-backend
services:
  database:
    image: postgres:18-alpine
    container_name: pg-sctec
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sctec
    ports:
      - "5432:5432" # nosso:container 
    volumes:
      - pgdata:/var/lib/postgresql/18/data # nome:caminho
    networks:
      - net-sctec-backend

networks:
  net-sctec-backend:

volumes:
  pgdata:
